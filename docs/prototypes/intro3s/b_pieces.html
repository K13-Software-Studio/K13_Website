<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K13 Intro B Pieces</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0}html,body{height:100%;background:#E6EAF2;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:#F3F5FA;transform-origin:50% 50%}
canvas{position:absolute;inset:0;width:1920px;height:1080px}
</style></head><body><div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t;
  return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<40;i++){const v=sx(t);if(Math.abs(v-x)<1e-7)break;if(v<x)lo=t;else hi=t;t=(lo+hi)/2}return sy(t)}}
const eOut=bez(.22,1,.36,1),eIO=bez(.65,0,.35,1),eBack=bez(.34,1.56,.64,1),eX=bez(.87,0,.13,1);
const hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const C=document.getElementById('c'),g=C.getContext('2d');
const INK='#141D35',OR='#B94612',OR2='#EA5E14',PAPER='#F3F5FA',MUTED='#515C78';
const FS=560,BASE=760;let KW,NW,X0,pieces=[];const CELL=34;
// the small things software is made of
function piece(type,s){g.save();switch(type){
  case 0:g.fillStyle=OR;rr(-s*.8,-s*.32,s*1.6,s*.64,s*.32);g.fill();break;                                   // a button
  case 1:g.fillStyle=OR2;rr(-s*.7,-s*.36,s*1.4,s*.72,s*.36);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(s*.34,0,s*.26,0,7);g.fill();break; // a toggle, on
  case 2:g.fillStyle=OR;rr(-s*.42,-s*.42,s*.84,s*.84,s*.16);g.fill();g.strokeStyle='#fff';g.lineWidth=s*.14;g.lineCap='round';g.beginPath();g.moveTo(-s*.2,0);g.lineTo(-s*.04,s*.17);g.lineTo(s*.24,-s*.16);g.stroke();break; // a tick
  case 3:g.fillStyle=INK;g.beginPath();g.moveTo(-s*.3,-s*.45);g.lineTo(s*.32,s*.12);g.lineTo(s*.02,s*.12);g.lineTo(-s*.12,s*.46);g.closePath();g.fill();break; // a cursor
  case 4:g.strokeStyle=OR;g.lineWidth=s*.14;g.lineCap='round';g.beginPath();g.moveTo(-s*.7,0);g.lineTo(s*.7,0);g.stroke();g.fillStyle=OR2;g.beginPath();g.arc(s*.15,0,s*.24,0,7);g.fill();break; // a slider
  case 5:g.fillStyle='#fff';rr(-s*.6,-s*.48,s*1.2,s*.96,s*.16);g.fill();g.fillStyle=OR;g.fillRect(-s*.42,-s*.3,s*.5,s*.1);g.fillStyle='#E4C3AE';g.fillRect(-s*.42,-s*.08,s*.84,s*.08);g.fillRect(-s*.42,s*.1,s*.6,s*.08);break; // a card
  default:g.fillStyle=OR2;g.beginPath();g.arc(0,0,s*.36,0,7);g.fill()}g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function setup(){g.font=`600 ${FS}px Fraunces`;KW=g.measureText('K').width;NW=g.measureText('13').width;X0=(1920-(KW+NW))/2;
  // sample the "13" into cells; each filled cell gets a piece
  const o=document.createElement('canvas');o.width=1920;o.height=1080;const og=o.getContext('2d');og.font=`600 ${FS}px Fraunces`;og.fillStyle='#000';og.fillText('13',X0+KW,BASE);
  const d=og.getImageData(0,0,1920,1080).data;let i=0;
  for(let y=BASE-FS;y<BASE+40;y+=CELL)for(let x=X0+KW-20;x<X0+KW+NW+20;x+=CELL){const a=d[((y|0)*1920+(x|0))*4+3];if(a>128){
    const ang=hash(i)*6.283,dist=900+hash(i+.3)*700;pieces.push({tx:x,ty:y,sx:960+Math.cos(ang)*dist,sy:540+Math.sin(ang)*dist,rot:(hash(i+.7)-.5)*7,type:Math.floor(hash(i+.9)*7),del:hash(i+.5)*.45+((x-X0)/1920)*.25});i++}}}
const TOTAL=3.0,HOLD=0.9;
function render(t){g.fillStyle=PAPER;g.fillRect(0,0,1920,1080);
  // 1. the pieces fly in and lock into a 13 (0 to 1.25)
  const melt=eIO(P(t,1.15,1.55));
  if(melt<1)for(const p of pieces){const k=eBack(P(t,p.del,p.del+.75)),kp=eOut(P(t,p.del,p.del+.75));if(k<=0)continue;
    g.save();g.globalAlpha=1-melt;g.translate(lerp(p.sx,p.tx,kp),lerp(p.sy,p.ty,kp));g.rotate(p.rot*(1-kp));const s=CELL*.92*(.4+.6*Math.min(k,1.2));piece(p.type,s);g.restore()}
  // 2. they melt into the real numeral
  if(melt>0){g.save();g.globalAlpha=melt;g.font=`600 ${FS}px Fraunces`;g.fillStyle=OR;const sc=lerp(1.04,1,eOut(P(t,1.15,1.8)));
    g.translate(X0+KW+NW/2,BASE-FS*.35);g.scale(sc,sc);g.fillText('13',-NW/2,FS*.35);g.restore()}
  // 3. the K slides in from behind a mask (1.45 to 2.0)
  const kk=eX(P(t,1.45,2.0));if(kk>0){g.save();g.beginPath();g.rect(X0-40,BASE-FS,KW+40,FS+80);g.clip();g.font=`600 ${FS}px Fraunces`;g.fillStyle=INK;g.fillText('K',X0+lerp(KW+40,0,kk),BASE);g.restore()}
  // 4. the tag types itself (2.0 to 2.45), with a cursor
  const tag='SOFTWARE STUDIO',n=Math.floor(P(t,2.0,2.45)*tag.length);if(t>1.95){g.font='500 34px "JetBrains Mono"';g.fillStyle=MUTED;
    let x=X0+8,y=BASE+90;const sp=12;for(let i=0;i<n;i++){g.fillText(tag[i],x,y);x+=g.measureText(tag[i]).width+sp}
    if(t<2.9&&Math.floor(t*4)%2===0){g.fillStyle=OR2;g.fillRect(x+2,y-30,16,36)}}
  // 5. a gentle settle
}
window.render=render;window.TL={TOTAL};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
document.fonts.load('600 100px Fraunces').then(()=>document.fonts.load('500 20px "JetBrains Mono"')).then(()=>{setup();const t0=performance.now();(function loop(){const t=((performance.now()-t0)/1000)%(TOTAL+HOLD);render(Math.min(t,TOTAL));requestAnimationFrame(loop)})()});
</script></body></html>
