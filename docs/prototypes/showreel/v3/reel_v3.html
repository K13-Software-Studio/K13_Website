<html lang="en"><head><meta charset="UTF-8"><title>K13 Reel: Obvious takes work</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}

.layer{position:absolute;inset:0;overflow:hidden}

.dots{position:absolute;inset:-40px;background-image:radial-gradient(rgba(203,77,20,.22) 1.4px,transparent 1.8px);background-size:32px 32px}
.wash{position:absolute;border-radius:50%;filter:blur(90px)}
.ch{display:inline-block}
.mask{overflow:hidden;display:inline-block;vertical-align:top;padding:0 .06em}

/* A: the button */
#cap{left:0;width:1920px;top:392px;text-align:center;font-family:var(--mono);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
#iso{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 50%}
#stack{position:absolute;left:960px;top:540px;width:0;height:0;transform-style:preserve-3d}
.ly{position:absolute;transform-style:preserve-3d}
.ly .box{position:absolute;left:0;top:0;border-radius:18px}
.ly .lab{position:absolute;top:50%;font-family:var(--mono);font-size:25px;letter-spacing:.06em;color:var(--ink);white-space:nowrap;transform:translateY(-50%);display:flex;align-items:center;gap:14px}
.ly .lab i{display:block;width:70px;height:1.5px;background:var(--or);transform-origin:0 50%}
.ly .lab b{font-weight:500;color:var(--or)}
.btnlabel{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-weight:600;font-size:40px;color:#fff;letter-spacing:-.005em}
#cursor{position:absolute;left:0;top:0;width:44px;height:56px;z-index:50}

/* C: under the hood */
#s3{background:var(--ink)}
#mega{position:absolute;inset:0;transform-origin:960px 540px}
.cell{position:absolute;width:568px;height:288px;border-radius:14px;overflow:hidden}
.pan{background:#0f1830;border:1px solid rgba(243,245,250,.12);font-family:var(--mono);color:rgba(243,245,250,.85)}
.pan .hd{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:rgba(243,245,250,.55);border-bottom:1px solid rgba(243,245,250,.08)}
.pan .hd b{color:var(--or2);font-weight:500}
.pan .hd i{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--green)}
.pan .bd{position:absolute;left:0;right:0;top:40px;bottom:0;overflow:hidden;padding:14px 20px;font-size:16px;line-height:1.62}
.ok{color:var(--green)}.k{color:#EA5E14}.s{color:#9fb3d9}.c{color:rgba(243,245,250,.4)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.shot::after{content:"";position:absolute;inset:0;background:var(--ink);opacity:.35}
.ghost{background:#0f1830;border:1px solid rgba(243,245,250,.08)}
.ghost span{position:absolute;left:20px;height:8px;border-radius:4px;background:rgba(243,245,250,.1)}
#streaks{position:absolute;inset:0}
#bang{position:absolute;inset:0;background:var(--paper)}

/* E: punchline */
#s5{}
#setup{left:0;width:1920px;top:250px;text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

#ripple{position:absolute;border-radius:50%;border:3px solid var(--or2);z-index:4}

#ring1{position:absolute;left:960px;top:470px;border-radius:50%;border:5px solid var(--or2)}
#lock{left:0;width:1920px;top:250px;text-align:center}
#k13{position:relative;display:inline-block;font-family:var(--disp);font-weight:700;font-size:330px;line-height:1;letter-spacing:-.02em}

#tag{margin-top:52px;font-family:var(--disp);font-style:italic;font-weight:500;font-size:54px;color:var(--ink2)}
#tag .ch{margin-right:.22em}
#site{margin-top:34px;font-family:var(--mono);font-size:28px;letter-spacing:.08em;color:var(--or)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);font-size:16px;letter-spacing:.14em;text-transform:uppercase;z-index:100}
#hud .h{position:absolute;display:flex;gap:18px;align-items:center}
#hud .tl{left:56px;top:44px}#hud .tr{right:56px;top:44px}#hud .bl{left:56px;bottom:44px}#hud .br{right:56px;bottom:44px}
#hud .bar{width:220px;height:2px;background:currentColor;opacity:.3;position:relative}
#hud .bar i{position:absolute;left:0;top:0;height:2px;background:var(--or2);width:0}
.crop{position:absolute;width:26px;height:26px;border-color:currentColor;border-style:solid;opacity:.6}
</style></head>

<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;

  return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<40;i++){const v=sx(t);if(Math.abs(v-x)<1e-7)break;if(v<x)lo=t;else hi=t;t=(lo+hi)/2}return sy(t)}}
const eOut=bez(.22,1,.36,1),eBack=bez(.34,1.56,.64,1),eIO=bez(.65,0,.35,1),eX=bez(.87,0,.13,1),eIn=bez(.55,0,1,.45),eOut2=bez(.16,1,.3,1),eW=bez(.4,0,.2,1);

const TOTAL=20;

/* ---------- A/B: the button and its layers ---------- */

 ['shadow','<div class="box" style="width:%W;height:%H;background:rgba(20,29,53,.35);filter:blur(18px);transform:translateY(14px)"></div>','<b>shadow</b> 0 10px 24px -12px'],
 ['hit','<div class="box" style="left:-22px;top:-22px;width:calc(%W + 44px);height:calc(%H + 44px);border:2px dashed rgba(20,29,53,.45)"></div>','<b>tap target</b> ≥ 44 × 44'],
 ['fill','<div class="box" style="width:%W;height:%H;background:#B94612"></div>','<b>fill</b> #B94612 · 5.32:1'],
 ['hover','<div class="box" style="width:%W;height:%H;background:#141D35"></div>','<b>hover</b> ink · 0.3s'],

];

const VP=[320,360,375,390,414,768,1024,1440,1920];
const PANELS=[
 ['styles.css',`<div class="scroll">${[...CSS,...CSS,...CSS].map(l=>`<div>${l}</div>`).join('')}</div>`],
 ['easing',`<svg viewBox="0 0 528 230" style="width:100%;height:100%"><path d="M40 210 H510 M40 210 V16" stroke="rgba(243,245,250,.2)" fill="none"/><path class="curve" d="M40 210 C 143 16, 209 16, 510 16" stroke="#EA5E14" stroke-width="4" fill="none" pathLength="1" stroke-dasharray="1 1"/><circle class="edot" r="9" fill="#F3F5FA"/><text x="60" y="44" fill="rgba(243,245,250,.7)" font-size="18" font-family="JetBrains Mono">cubic-bezier(.22,1,.36,1)</text></svg>`],
 ['contrast',`<div style="display:flex;gap:18px;align-items:center;margin-top:8px"><div style="width:120px;height:120px;border-radius:12px;background:#F3F5FA;color:#141D35;font-family:Fraunces;font-weight:600;font-size:64px;display:flex;align-items:center;justify-content:center">Aa</div><div><div class="cnum" style="font-size:64px;font-family:Fraunces;font-weight:600;color:#F3F5FA;line-height:1">1.00:1</div><div class="ok" style="margin-top:8px">✓ AAA body text</div></div></div><div style="margin-top:18px;display:flex;gap:14px;align-items:center"><span style="width:40px;height:22px;border-radius:5px;background:#B94612;display:inline-block"></span><span class="cnum2">1.00:1</span><span class="ok">✓ AA</span></div>`],

 ['fitcheck',`<svg viewBox="0 0 528 230" style="width:100%;height:100%">${VP.map((w,i)=>`<rect class="vp" x="${20}" y="${220-(w/1920*200*0.62+14)}" width="${w/1920*490}" height="${w/1920*200*0.62+14}" fill="none" stroke="${i==8?'#EA5E14':'rgba(243,245,250,.5)'}" stroke-width="2" pathLength="1" stroke-dasharray="1 1"/>`).join('')}<text class="vpt" x="508" y="40" text-anchor="end" fill="#F3F5FA" font-size="30" font-family="Fraunces" font-weight="600">320</text><text x="508" y="66" text-anchor="end" fill="rgba(243,245,250,.55)" font-size="14" font-family="JetBrains Mono">9 VIEWPORTS</text></svg>`],
 ['vercel.json',`<div class="hdr">${HDR.map(h=>`<div><span class="ok">✓</span> ${h}</div>`).join('')}</div>`],
 ['reduced motion',`<div style="display:flex;align-items:center;gap:16px;margin-top:6px"><div class="tog" style="width:74px;height:40px;border-radius:40px;background:rgba(243,245,250,.2);position:relative"><div class="knob" style="position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#F3F5FA"></div></div><span class="togl">prefers-reduced-motion: no-preference</span></div><div style="position:relative;height:120px;margin-top:20px;border-top:1px dashed rgba(243,245,250,.2)"><div class="ball" style="position:absolute;top:34px;left:0;width:52px;height:52px;border-radius:50%;background:#EA5E14"></div></div>`],
 ['git log',`<div class="scroll">${[...GIT,...GIT].map((g,i)=>`<div><span class="k">${(hash(i)*0xfffffff|0).toString(16).slice(0,7)}</span> ${g}</div>`).join('')}</div>`],
 ['deploy',`<div class="dep">${DEPLOY.map(([p,l])=>`<div><span class="${p.trim()=='$'?'c':p.trim()=='▲'?'s':'ok'}">${p}</span><span class="dt" data-t="${l}"></span></div>`).join('')}</div>`],
];
const mega=$('#mega');const panels=[],outers=[];
const SHOTS="thg-hero,lavida-live,miramar-live,cengo-live,station8-live,globalfork-live,eggout-live,trustmebro-live,baa-stop,barfix-live,lobsterlab-live,carlos-live".split(',');
for(let r=-4;r<=4;r++)for(let c=-4;c<=4;c++){const [x,y]=cellPos(r,c);const d=document.createElement('div');d.style.left=x+'px';d.style.top=y+'px';
  if(Math.abs(r)<=1&&Math.abs(c)<=1){const i=(r+1)*3+(c+1);const [ttl,body]=PANELS[i];d.className='cell pan';

$$('.split').forEach(el=>{el.innerHTML=[...el.textContent].map(c=>c===' '?'<span class="ch">&nbsp;</span>':`<span class="ch">${c}</span>`).join('')});

function scramble(S,t,st,G="K13/_#<>01{}"){let o='';for(let i=0;i<S.length;i++){const vis=t>=st+i*0.012,res=t>=st+0.1+i*0.022;o+=!vis?' ':(res||S[i]===' ')?S[i]:G[Math.floor(hash(i*13+Math.floor(t*28))*G.length)]}return o}

function render(t){
  /* ===== A + B (0 - 5.5) */
  const s1=$('#s1');show(s1,t<5.5);
  if(t<5.5){
    $('#d1').style.opacity=0.55;$('#d1').style.transform=`translateY(${-t*10}px)`;
